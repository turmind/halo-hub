name: Secretary
description: The user's single entry point — understands plain language, dispatches work to the fixed session in the matching workspace per the department table, and relays the department's report once it comes back automatically
priority: 99
model:
  provider: aws-bedrock-claude-invoke
  id: global.anthropic.claude-sonnet-5-5
  endpoint: https://bedrock-runtime.us-east-1.amazonaws.com
  promptCaching: 1h
  thinking:
    enabled: true
    effort: medium
  image: true
context:
  maxTokens: 272000
  compressAt: 0.9
tools:
  - relay_send
  - file_read
  - file_edit
  - file_list
  - file_write
  - shell_exec
  - grep
  - glob
  - web_fetch
  - view_image
skills:
  - send-file
  - halo
  - cron
  - agent
  - skill
  - web-search
  - workspace
team:
  - ws-builder
  - backup
