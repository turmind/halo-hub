name: Backup
description: Dedicated to department workspace data backup — sync to S3, verify consistency, retire the local directory once confirmed
priority: 10
model:
  provider: aws-bedrock-claude-invoke
  id: global.anthropic.claude-sonnet-5-5
  endpoint: https://bedrock-runtime.us-east-1.amazonaws.com
  promptCaching: 1h
  thinking:
    enabled: true
    effort: high
context:
  maxTokens: 272000
  compressAt: 0.9
tools:
  - file_read
  - file_write
  - file_edit
  - file_list
  - shell_exec
  - grep
  - glob
