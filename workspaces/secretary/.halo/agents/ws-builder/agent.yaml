name: Workspace Builder
description: Builds a workspace from scratch for a new department — creates the directory, writes INSTRUCTIONS.md / INDEX.md, configures the entry agent and skills, and after validation hands a department-table row back to the secretary
priority: 10
model:
  provider: aws-bedrock-claude-invoke
  id: global.anthropic.claude-opus-5-5
  endpoint: https://bedrock-runtime.us-east-1.amazonaws.com
  promptCaching: 1h
  thinking:
    enabled: true
    effort: xhigh
context:
  maxTokens: 272000
  compressAt: 0.9
# Dispatched only by the secretary via start_session. The new workspace is outside this one,
# so it is read/written via full access (inherited from the secretary session) + absolute paths.
tools:
  - file_read
  - file_write
  - file_edit
  - file_list
  - shell_exec
  - grep
  - glob
  - view_image
skills:
  - workspace
  - agent
  - skill
  - halo
