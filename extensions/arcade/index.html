<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Same origin as the admin (sandbox allow-same-origin), so the page carries its own CSP: nothing remote can load or
     connect. EmulatorJS needs blob: for the core script / wasm / unzip worker, 'wasm-unsafe-eval' to compile the core,
     'unsafe-eval' for its prebuilt asm.js 7z extractor (emscripten cwrap calls eval; the blob: workers inherit
     this policy), and inline style attributes for its own DOM. Script sources stay 'self' + blob:. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob: 'unsafe-eval' 'wasm-unsafe-eval'; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:; media-src blob:; base-uri 'none'; form-action 'none'">
<title>Arcade · FinalBurn Neo</title>
<link rel="stylesheet" href="emulatorjs/emulator.css">
<link rel="stylesheet" href="style.css">
<div id="app">
  <header id="bar" class="bar">
    <span id="sys" class="sys"></span>
    <span id="pad" class="chip"></span>
    <span class="grow"></span>
    <button id="bHelp" type="button" data-i="help"></button>
    <button id="bPause" type="button" disabled></button>
    <button id="bSave" type="button" disabled data-i="save"></button>
    <button id="bLoad" type="button" disabled data-i="load"></button>
    <label class="sel"><span data-i="display"></span><select id="shader"></select></label>
    <button id="bMute" type="button" class="icon"></button>
    <input id="vol" type="range" min="0" max="1" step="0.05" aria-label="volume">
    <button id="bTouch" type="button"></button>
    <button id="bPick" type="button" class="pick" disabled data-i="pick"></button>
    <button id="bFull" type="button" data-i="full"></button>
  </header>
  <main id="stage" tabindex="-1">
    <div id="game"></div>
    <section id="busy" class="panel center"><div class="card slim"><p class="muted" data-i="reading"></p></div></section>
    <section id="choose" class="panel center" hidden>
      <div class="card slim">
        <div class="fname title"></div>
        <button type="button" class="big pick" data-i="choose"></button>
        <p class="muted" data-i="accepts"></p>
      </div>
    </section>
    <section id="start" class="panel center" hidden>
      <div class="card">
        <div class="fname title"></div>
        <div id="startSys" class="sysbig"></div>
        <button id="bStart" type="button" class="big"></button>
        <div class="muted hint" data-i="startKeys"></div>
        <div id="startHelp"></div>
      </div>
    </section>
    <section id="missing" class="panel center" hidden>
      <div class="card slim">
        <h2 data-i="missing"></h2>
        <p id="missingText"></p>
        <p id="readError" class="muted" hidden></p>
        <button type="button" class="big pick" data-i="repick"></button>
      </div>
    </section>
    <section id="needs" class="panel center" hidden>
      <div class="card slim">
        <h2 data-i="needsTitle"></h2>
        <ul id="needsList" class="needs"></ul>
        <p id="needsWhere"></p>
        <p id="needsDir" class="muted fname"></p>
        <p id="needsError" class="muted" hidden></p>
        <button id="bRetry" type="button" class="big" data-i="retry"></button>
        <button type="button" class="link pick" data-i="repick"></button>
      </div>
    </section>
    <section id="notrom" class="panel center" hidden>
      <div class="card">
        <h2 id="notromTitle"></h2>
        <p id="notromName" class="muted"></p>
        <p id="unknown" hidden></p>
        <p class="muted" data-i="setHint"></p>
        <ul id="entries" class="entries"></ul>
        <button type="button" class="big pick" data-i="repick"></button>
      </div>
    </section>
    <section id="help" class="panel" hidden>
      <div class="card">
        <button id="bHelpClose" type="button" class="close">×</button>
        <div id="helpBody"></div>
      </div>
    </section>
    <div id="stick" class="stick"><div id="stickBase" class="stick-base"><div id="stickKnob" class="stick-knob"></div></div></div>
    <div id="paused" class="paused" hidden><span id="pausedText"></span></div>
    <button id="vPause" type="button" class="vpause" hidden></button>
    <div id="toast" class="toast" hidden></div>
  </main>
</div>
<script src="app.js"></script>
