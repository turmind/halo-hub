<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Same origin as the admin (sandbox allow-same-origin), so the page carries its own CSP: no inline script / style, no
     remote anything; connect-src covers the server's /api/stt/stream WebSocket and fetching MODEL_LICENSE.txt. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' ws: wss:; base-uri 'none'; form-action 'none'">
<title>Voice Input · 语音输入</title>
<link rel="stylesheet" href="style.css">
<div id="app">
  <section class="main">
    <span id="ind" class="ind" aria-hidden="true">
      <svg class="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
      <span class="spin"></span>
    </span>
    <div class="info">
      <div class="head">
        <span id="status" class="status" role="status"></span>
        <span id="timer" class="timer" hidden>0:00</span>
      </div>
      <div id="levelRow" class="bar level" hidden><i id="level"></i></div>
      <div id="dlRow" class="bar dl" hidden><i id="dl"></i></div>
      <div id="sub" class="sub" hidden></div>
      <div class="actions">
        <button id="act" class="act" type="button" hidden></button>
        <select id="mic" class="mic" hidden></select>
      </div>
    </div>
    <button id="aboutBtn" class="about-btn" type="button">ⓘ</button>
  </section>
  <section id="recent" class="recent"></section>
</div>

<div id="about" class="overlay" hidden>
  <header class="ov-bar"><button id="aboutClose" class="ov-close" type="button">←</button><span id="aboutTitle" class="ov-title"></span></header>
  <div id="aboutBody" class="ov-body"></div>
</div>
<div id="license" class="overlay" hidden>
  <header class="ov-bar"><button id="licenseBack" class="ov-close" type="button">←</button><span class="ov-title">FunASR Model License v1.1</span></header>
  <pre id="licenseText" class="ov-body license"></pre>
</div>
<script type="module" src="app.js"></script>
