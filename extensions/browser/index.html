<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' ws: wss:; img-src blob:; base-uri 'none'; form-action 'none'">
  <title>Browser · Halo</title>
  <link rel="stylesheet" href="./dist/viewer.css">
  <script type="module" src="./dist/viewer.js"></script>
</head>
<body class="m-0 h-dvh overflow-hidden bg-background font-sans text-sm text-foreground">
  <main class="flex h-full flex-col">
    <header class="relative flex h-8 shrink-0 items-center gap-1 border-b border-border bg-card px-1">
      <button id="back" data-title="back" class="size-6 shrink-0 rounded hover:bg-accent disabled:opacity-50">←</button>
      <button id="forward" data-title="forward" class="size-6 shrink-0 rounded hover:bg-accent disabled:opacity-50">→</button>
      <button id="reload" data-title="reload" class="size-6 shrink-0 rounded hover:bg-accent disabled:opacity-50">⟳</button>
      <input id="address" data-title="address" type="text" autocomplete="off" spellcheck="false" class="h-6 min-w-0 flex-1 rounded border border-border bg-background px-2 text-xs disabled:opacity-50">
      <button id="new-tab" data-title="newTab" class="size-6 shrink-0 rounded hover:bg-accent disabled:opacity-50">＋</button>
      <span id="mode" role="status" tabindex="0" class="shrink-0 rounded bg-muted px-2 py-1 text-xs text-muted-foreground">Waiting for Halo…</span>
      <button id="reconnect" hidden class="shrink-0 rounded px-1 text-xs hover:bg-accent">Reconnect</button>
      <button id="info" data-title="limits" aria-expanded="false" aria-controls="limits" class="size-6 shrink-0 rounded hover:bg-accent">ⓘ</button>
      <div id="limits" hidden role="note" class="absolute right-1 top-9 z-10 w-80 max-w-[calc(100vw-8px)] rounded border border-border bg-card p-3 text-xs shadow-lg" data-label="limitsText"></div>
    </header>
    <p id="error" role="alert" hidden class="m-0 shrink-0 border-b border-border px-3 py-2 text-destructive"></p>
    <nav id="tabs" data-title="tabs" hidden class="flex shrink-0 gap-1 overflow-x-auto border-b border-border p-1"></nav>
    <div id="surface" class="relative min-h-0 flex-1 overflow-hidden bg-muted">
      <canvas id="screen" width="1280" height="800" aria-label="Remote browser, read-only" class="absolute touch-none"></canvas>
      <textarea id="input" aria-label="Remote browser keyboard input" autocomplete="off" autocapitalize="off" spellcheck="false" disabled class="pointer-events-none absolute size-px resize-none overflow-hidden border-0 p-0 opacity-0"></textarea>
      <p id="empty" class="pointer-events-none absolute inset-0 m-0 flex items-center justify-center p-8 text-center text-muted-foreground">Waiting for browser…</p>
    </div>
  </main>
</body>
</html>
