<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;height:100%}
  body{display:flex;flex-direction:column;gap:8px;padding:12px;box-sizing:border-box;font:14px system-ui}
  textarea{flex:1;font:13px ui-monospace,monospace;resize:none}
  #err{color:#c00}
</style>
<div id="info">Waiting for file…</div>
<textarea id="text" hidden></textarea>
<div id="err"></div>
<script>
  const post = (m, transfer) => parent.postMessage({ haloExt: 1, ...m }, '*', transfer);
  const info = document.getElementById('info');
  const text = document.getElementById('text');
  const err = document.getElementById('err');
  addEventListener('message', (e) => {
    if (e.source !== parent || e.data?.haloExt !== 1) return;
    const m = e.data;
    if (m.type === 'load') {
      // Also fired when the file changes on disk and we are not dirty: replace the document.
      info.textContent = `${m.buffer.byteLength} bytes`;
      text.value = new TextDecoder().decode(m.buffer);
      text.hidden = false;
      err.textContent = '';
    } else if (m.type === 'save-request') {
      const buffer = new TextEncoder().encode(text.value).buffer;
      post({ type: 'save', buffer }, [buffer]);
    } else if (m.type === 'saved') {
      err.textContent = '';
      post({ type: 'dirty', dirty: false });
    } else if (m.type === 'save-error') {
      err.textContent = `Save failed (${m.reason}): ${m.message}`;
    }
  });
  text.addEventListener('input', () => post({ type: 'dirty', dirty: true }));
  post({ type: 'ready', protocol: 1 });
</script>
